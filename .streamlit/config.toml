[browser]
gatherUsageStats = false

[server]
enableCORS = false
enableXsrfProtection = false
headless = true

[theme]
base = "dark"
primaryColor = "#E2B25C"
backgroundColor = "#0A0B0D"
secondaryBackgroundColor = "#101216"
textColor = "#C9CDD3"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false
